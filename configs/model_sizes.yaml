# Architecture presets (mirrors nepali_gpt2/config.py -> MODEL_CONFIGS).
# Scaling depth and width together keeps training cost roughly linear in
# model size while holding the 16k-vocab fixed.
small:
  vocab_size: 16000
  context_length: 512
  emb_dim: 384
  n_heads: 6
  n_layers: 6
  drop_rate: 0.1
  qkv_bias: false

base:  # default
  vocab_size: 16000
  context_length: 512
  emb_dim: 512
  n_heads: 8
  n_layers: 8
  drop_rate: 0.1
  qkv_bias: false

large:
  vocab_size: 16000
  context_length: 512
  emb_dim: 768
  n_heads: 12
  n_layers: 12
  drop_rate: 0.1
  qkv_bias: false