# Default training hyper-parameters (mirrors config.py -> TRAIN_DEFAULTS).
model_size: base
epochs: 10
max_steps: 15000
batch_size: 32
lr: 0.0005
min_lr_ratio: 0.1
weight_decay: 0.1
grad_clip: 1.0
warmup_steps: 500
eval_every: 500
eval_batches: 100
save_every: 5000
seed: 42

# Artifact paths (relative to the repo root).
token_cache: data/tokens.npy
ckpt_dir: ckpt